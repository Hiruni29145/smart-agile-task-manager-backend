# SonarQube Configuration for tour-web-system-backend

# Project identification
sonar.projectKey=tour-web-system-backend
sonar.projectName=Tour Web System Backend
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/test/**

# TypeScript analysis
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Code coverage
sonar.coverage.exclusions=**/*.spec.ts,**/*.e2e-spec.ts,**/test/**,**/main.ts

# Duplicate detection
sonar.cpd.exclusions=**/*.spec.ts,**/*.dto.ts

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate
sonar.qualitygate.wait=true
