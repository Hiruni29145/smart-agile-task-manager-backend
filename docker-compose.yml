services:
  # ================================
  # NestJS API Application
  # ================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hiruni-backend
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - hiruni-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  hiruni-network:
    driver: bridge
