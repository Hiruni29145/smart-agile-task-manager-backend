name: CD Pipeline

on:
  push:
    branches:
      - setup/ci-cd-pipeline


jobs:
  deploy:
    name: Build and Deploy directly on EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy Repository to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "~/hiruni-backend"

      - name: Build and Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/hiruni-backend
            
            # We assume your .env file is safely stored at ~/.env on the EC2 server
            # Copy it to the project directory so Docker Compose can automatically load it
            cp ~/.env .env
            
            # Build and deploy the container using Docker Compose
            docker compose up -d --build
            
            # Wait for container to start
            sleep 10
            
            # Run migrations after the container is up
            if docker ps --format '{{.Names}}' | grep -q '^hiruni-backend$'; then
                docker exec hiruni-backend npx prisma migrate deploy
            else
                echo "Container failed to start."
                docker compose logs
                exit 1
            fi
